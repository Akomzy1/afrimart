  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"sheet-body\"><button class=\"menurow\" data-nav-menu=\"catalogue\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"15\" width=\"7\" height=\"5\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"15\" width=\"7\" height=\"5\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fspan><span class=\"m\"><span class=\"t\">Catalogue<\u002Fspan><span class=\"s\">Prices and availability<\u002Fspan><\u002Fspan><span class=\"ch\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 6l6 6-6 6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><button class=\"menurow\" data-nav-menu=\"earnings\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M12 3v18M8 7h6a2.5 2.5 0 0 1 0 5H9a2.5 2.5 0 0 0 0 5h7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"m\"><span class=\"t\">Earnings<\u002Fspan><span class=\"s\">Payouts and history<\u002Fspan><\u002Fspan><span class=\"ch\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 6l6 6-6 6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"sheet\" id=\"catSheet\"><div class=\"sheet-in\" id=\"catSheetIn\"><\u002Fdiv><\u002Fdiv>\n\n  <div class=\"toast\" id=\"toast\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span id=\"toastMsg\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<aside class=\"logokit\">\n  <div class=\"kt\">AfriMart logo<\u002Fdiv>\n  <div class=\"lock\">\n    <svg width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F3D2B\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M11 21c-5-1-8-5-8-11 6 0 10 4 10 11M13 21c5-1 8-5 8-11-6 0-10 4-10 11\"><\u002Fpath><path d=\"M12 22V10\" stroke=\"#C05621\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n    <div class=\"wmk\">Afri<span class=\"m\">Mart<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"lock rev\">\n    <svg width=\"38\" height=\"38\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FAF5EE\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M11 21c-5-1-8-5-8-11 6 0 10 4 10 11M13 21c5-1 8-5 8-11-6 0-10 4-10 11\"><\u002Fpath><path d=\"M12 22V10\" stroke=\"#E8A44D\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n    <div class=\"wmk\">Afri<span class=\"m\">Mart<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"cap\">Leaf mark and wordmark as they appear in the seller app header.<\u002Fp>\n\n  <div class=\"dl\" id=\"logoDl\">\n    <button data-dl=\"mark\">Leaf mark<span class=\"ext\">SVG<\u002Fspan><\u002Fbutton>\n    <button data-dl=\"mark-reversed\">Leaf mark, reversed<span class=\"ext\">SVG<\u002Fspan><\u002Fbutton>\n    <button data-dl=\"lockup\">Lockup<span class=\"ext\">SVG<\u002Fspan><\u002Fbutton>\n    <button data-dl=\"lockup-reversed\">Lockup, reversed<span class=\"ext\">SVG<\u002Fspan><\u002Fbutton>\n    <button data-dl=\"png\">Leaf mark, 512px<span class=\"ext\">PNG<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Faside>\n\n<script>\nconst glyphs={\n  leaf:'<path d=\"M11 21c-5-1-8-5-8-11 6 0 10 4 10 11M13 21c5-1 8-5 8-11-6 0-10 4-10 11M12 22V10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>',\n  wheat:'<path d=\"M12 22V9M12 9c0-2 1.5-3.5 3.5-3.5 0 2-1.5 3.5-3.5 3.5zM12 9c0-2-1.5-3.5-3.5-3.5 0 2 1.5 3.5 3.5 3.5zM12 14c0-2 1.5-3.5 3.5-3.5 0 2-1.5 3.5-3.5 3.5zM12 14c0-2-1.5-3.5-3.5-3.5 0 2 1.5 3.5 3.5 3.5z\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>',\n  jar:'<path d=\"M8 3h8M7 7h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V7zM7 7c0-2 1.5-3 2.5-3M17 7c0-2-1.5-3-2.5-3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>',\n  pepper:'<path d=\"M8 8c0-3 3-4 5-3M8 8c-2 3-1 8 3 10 5 2 8-3 6-7-1.5-3-6-4-9-3z\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>',\n  seed:'<path d=\"M12 3c4 2 6 5 6 9a6 6 0 0 1-12 0c0-4 2-7 6-9zM12 8v8M9 11h6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'\n};\nconst money=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst check='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>';\n\nlet orders=[\n  {id:'#1042',buyer:'Amara O.',ago:'2 min ago',status:'new',step:0,checked:new Set(),items:[\n    {n:'Egusi',qty:2,g:'leaf'},{n:'Ata Rodo',qty:1,g:'pepper'},{n:'Red Palm Oil',qty:1,g:'jar'},{n:'Garri',qty:2,g:'wheat'}\n  ],value:48.20},\n  {id:'#1041',buyer:'Kofi B.',ago:'18 min ago',status:'new',step:0,checked:new Set(),items:[\n    {n:'Suya Spice',qty:1,g:'seed'},{n:'Plantain Flour',qty:1,g:'leaf'},{n:'Crayfish',qty:1,g:'seed'}\n  ],value:27.50},\n  {id:'#1039',buyer:'Ngozi A.',ago:'1 hr ago',status:'packing',step:0,checked:new Set(),items:[\n    {n:'Garri',qty:3,g:'wheat'},{n:'Egusi',qty:1,g:'leaf'},{n:'Berbere',qty:1,g:'seed'},{n:'Ata Rodo',qty:2,g:'pepper'},{n:'Palm Oil',qty:1,g:'jar'}\n  ],value:63.00}\n];\nlet currentId=null;\nconst byId=id=>orders.find(o=>o.id===id);\nconst scroll=document.getElementById('scroll');\n\n// ===== orders list =====\nfunction renderOrders(){\n  const news=orders.filter(o=>o.status==='new'),pack=orders.filter(o=>o.status==='packing'),done=orders.filter(o=>o.status==='done');\n  let html='';\n  if(news.length){\n    html+=`<div class=\"sectitle\"><span class=\"eyebrow\">New orders<\u002Fspan><span class=\"n\">${news.length}<\u002Fspan><\u002Fdiv>`;\n    html+=news.map(o=>`<div class=\"ordcard new\">\n      <div class=\"oc-top\" data-open=\"${o.id}\"><div class=\"oc-l\"><div class=\"num\">${o.id}<\u002Fdiv><div class=\"meta\">${o.items.reduce((s,i)=>s+i.qty,0)} items<\u002Fdiv><div class=\"buyer\">${o.buyer}<\u002Fdiv><\u002Fdiv><div class=\"oc-r\"><div class=\"val tnum\">$${money(o.value)}<\u002Fdiv><div class=\"ago\">${o.ago}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <button class=\"accept\" data-accept=\"${o.id}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>Accept order<\u002Fbutton>\n    <\u002Fdiv>`).join('');\n  }\n  if(pack.length){\n    html+=`<div class=\"sectitle\" style=\"padding-top:16px\"><span class=\"eyebrow\">To pack<\u002Fspan><span class=\"n\" style=\"background:var(--green)\">${pack.length}<\u002Fspan><\u002Fdiv>`;\n    html+=pack.map(o=>`<div class=\"ordcard\">\n      <div class=\"oc-top\" data-open=\"${o.id}\"><div class=\"oc-l\"><div class=\"num\">${o.id}<\u002Fdiv><div class=\"meta\">${o.items.reduce((s,i)=>s+i.qty,0)} items<\u002Fdiv><div class=\"buyer\">${o.buyer}<\u002Fdiv><\u002Fdiv><div class=\"oc-r\"><div class=\"val tnum\">$${money(o.value)}<\u002Fdiv><div class=\"ago\">${o.ago}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"status-row\" data-open=\"${o.id}\"><span class=\"pill\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 8l3-4h12l3 4\" stroke-linejoin=\"round\"/><\u002Fsvg>${o.step===0?'Ready to pack':'Label printed · packing'}<\u002Fspan><span class=\"go\">Open<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 6l6 6-6 6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  }\n  if(done.length){\n    html+=`<div class=\"sectitle\" style=\"padding-top:16px\"><span class=\"eyebrow\">Packed today<\u002Fspan><\u002Fdiv>`;\n    html+=done.map(o=>`<div class=\"ordcard\" style=\"opacity:.72\">\n      <div class=\"oc-top\" data-open=\"${o.id}\"><div class=\"oc-l\"><div class=\"num\">${o.id}<\u002Fdiv><div class=\"meta\">${o.items.reduce((s,i)=>s+i.qty,0)} items<\u002Fdiv><div class=\"buyer\">${o.buyer}<\u002Fdiv><\u002Fdiv><div class=\"oc-r\"><div class=\"val tnum\">$${money(o.value)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"status-row\" data-open=\"${o.id}\" style=\"background:#e9f4ec\"><span class=\"pill\" style=\"color:var(--leaf)\">${check.replace('stroke-width=\"2.6\"','stroke-width=\"2.2\" style=\"width:18px;height:18px\"')}Packed · pickup scheduled<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  }\n  if(!news.length&&!pack.length&&!done.length)html=`<div class=\"empty\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M6 3h12l1 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7l1-4z\" stroke-linejoin=\"round\"/><\u002Fsvg><p>No orders right now.<br>Enjoy the quiet.<\u002Fp><\u002Fdiv>`;\n  document.getElementById('ordersBody').innerHTML=html;\n  const nc=orders.filter(o=>o.status==='new').length;\n  const badge=document.getElementById('ordBadge');badge.style.display=nc?'flex':'none';badge.textContent=nc;\n}\n\n// ===== detail =====\nfunction renderDetail(){\n  const o=byId(currentId);const total=o.items.reduce((s,i)=>s+i.qty,0);\n  let html=`<div class=\"d-summary\"><div class=\"l\"><div class=\"k\">${o.status==='new'?'New order':'Packing'}<\u002Fdiv><div class=\"buyer\">${o.buyer}<\u002Fdiv><div class=\"items\">${total} items · ${o.id}<\u002Fdiv><\u002Fdiv><div class=\"r\"><div class=\"val tnum\">$${money(o.value)}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n\n  if(o.status==='new'){\n    html+=`<div class=\"acceptnote\"><div class=\"eyebrow\">One order<\u002Fdiv><h3>${total} items to pack<\u002Fh3><p>Accept to start — we'll prepare the label.<\u002Fp><\u002Fdiv>`;\n    html+=`<div class=\"itemlist\">${o.items.map(it=>`<div class=\"il\"><div class=\"th\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">${glyphs[it.g]}<\u002Fsvg><\u002Fdiv><div class=\"nm\">${it.n}<\u002Fdiv><div class=\"qty tnum\">×${it.qty}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>`;\n  }else if(o.status==='packing'){\n    const packed=o.checked.size,need=o.items.length;\n    html+=`<div class=\"progress\"><div class=\"p on\"><\u002Fdiv><div class=\"p ${o.step>=1?'on':''}\"><\u002Fdiv><div class=\"p\"><\u002Fdiv><\u002Fdiv><div class=\"progress-lbl\">${o.step===0?'Step 1 — print the label':'Step 2 — pack every item'}<\u002Fdiv>`;\n    html+=`<div class=\"packhead\"><h3>Photo packing list<\u002Fh3><p>Tap each item as it goes in the box.<\u002Fp><\u002Fdiv>`;\n    html+=`<div class=\"tiles\">${o.items.map((it,i)=>`<button class=\"tile ${o.checked.has(i)?'on':''}\" data-check=\"${i}\"><div class=\"pic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">${glyphs[it.g]}<\u002Fsvg><\u002Fdiv><div class=\"b\"><div class=\"nm\">${it.n}<\u002Fdiv><div class=\"qty tnum\">Pack ×${it.qty}<\u002Fdiv><\u002Fdiv><div class=\"chk\">${check}<\u002Fdiv><\u002Fbutton>`).join('')}<\u002Fdiv>`;\n    html+=`<div class=\"packcount\"><b>${packed}<\u002Fb> of ${need} packed<\u002Fdiv>`;\n  }else{\n    html+=`<div class=\"completed\"><div class=\"seal\"><div class=\"ring\"><\u002Fdiv><div class=\"core\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Fdiv><\u002Fdiv><h1>Order packed.<\u002Fh1><div class=\"sub\">Well done.<\u002Fdiv><div class=\"pickup\"><div class=\"k\">Pickup scheduled<\u002Fdiv><div class=\"v\">Today · between 4 and 6 PM<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }\n  document.getElementById('detailBody').innerHTML=html;\n  renderActionBar();\n}\nfunction renderActionBar(){\n  const o=byId(currentId),bar=document.getElementById('actionbar'),btn=document.getElementById('bigbtn'),hint=document.getElementById('barhint');\n  hint.style.display='none';\n  if(o.status==='new'){\n    bar.classList.add('on');btn.className='bigbtn terra';btn.innerHTML=`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>Accept order`;\n  }else if(o.status==='packing'){\n    bar.classList.add('on');\n    if(o.step===0){btn.className='bigbtn green';btn.innerHTML=`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><rect x=\"6\" y=\"3\" width=\"12\" height=\"7\" rx=\"1\"/><rect x=\"4\" y=\"10\" width=\"16\" height=\"7\" rx=\"2\"/><rect x=\"7\" y=\"15\" width=\"10\" height=\"6\" rx=\"1\"/><\u002Fsvg>Print label`;}\n    else{const all=o.checked.size===o.items.length;\n      if(all){btn.className='bigbtn green';btn.innerHTML=`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>Mark packed`;}\n      else{btn.className='bigbtn disabled';btn.innerHTML=`Pack all items first`;hint.style.display='block';hint.textContent=`${o.items.length-o.checked.size} still to pack`;}\n    }\n  }else{\n    bar.classList.add('on');btn.className='bigbtn green';btn.innerHTML='Back to orders';\n  }\n}\ndocument.getElementById('bigbtn').addEventListener('click',()=>{\n  const o=byId(currentId);\n  if(o.status==='new'){o.status='packing';o.step=0;showToast(`${o.id} accepted`);renderDetail();}\n  else if(o.status==='packing'){\n    if(o.step===0){o.step=1;showToast('Label printed');renderDetail();}\n    else if(o.checked.size===o.items.length){o.status='done';showToast(`${o.id} packed`);renderDetail();}\n  }else{go('orders');}\n});\n\n// ===== events =====\ndocument.body.addEventListener('click',e=>{\n  const open=e.target.closest('[data-open]'),acc=e.target.closest('[data-accept]'),chk=e.target.closest('[data-check]');\n  if(acc){e.stopPropagation();const o=byId(acc.dataset.accept);o.status='packing';o.step=0;currentId=o.id;showToast(`${o.id} accepted`);go('detail');return;}\n  if(open){currentId=open.dataset.open;go('detail');return;}\n  if(chk){const o=byId(currentId),i=+chk.dataset.check;o.checked.has(i)?o.checked.delete(i):o.checked.add(i);renderDetail();return;}\n});\n// ===== CAMERA: capture + voice sheets =====\nconst micIc='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M6 11a6 6 0 0 0 12 0M12 17v4\" stroke-linecap=\"round\"/><\u002Fsvg>';\nconst stockItems=[{n:'Garri',g:'wheat',add:10,was:'shelf was running low'},{n:'Egusi',g:'leaf',add:6,was:'was out of stock'},{n:'Red Palm Oil',g:'jar',add:4,was:'2 left'}];\nfunction shHead(title,id){return `<div class=\"sheet-head\"><button class=\"x\" data-close=\"${id}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 6l12 12M18 6L6 18\" stroke-linecap=\"round\"/><\u002Fsvg><\u002Fbutton><h2>${title}<\u002Fh2><\u002Fdiv>`;}\nfunction viewfinder(t,s){return `<div class=\"viewfinder\" style=\"flex:1;height:auto;margin:8px 0\"><div class=\"corner c1\"><\u002Fdiv><div class=\"corner c2\"><\u002Fdiv><div class=\"corner c3\"><\u002Fdiv><div class=\"corner c4\"><\u002Fdiv><div class=\"hint\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"><path d=\"M4 9h16v11H4zM3 5h18v4H3zM12 5v15\" stroke-linejoin=\"round\"/><\u002Fsvg><div class=\"t\">${t}<\u002Fdiv><div class=\"s\">${s}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;}\n\ndocument.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>b.dataset.cam==='stock'?openStock():openVoice()));\ndocument.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)document.getElementById(c.dataset.close).classList.remove('on');});\n\nfunction openStock(){camStockShoot();document.getElementById('camStock').classList.add('on');}\nfunction camStockShoot(){\n  document.getElementById('camStockIn').innerHTML=shHead('New stock arrived','camStock')+`<div class=\"sheet-body\" style=\"padding-bottom:12px\">${viewfinder('Point at the delivery','Boxes, crates and bags — we\\'ll count them')}<\u002Fdiv><div class=\"sheet-foot\"><button class=\"bigbtn terra\" id=\"stockSnap\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 7l1.5-2.5h5L16 7\" stroke-linejoin=\"round\"/><circle cx=\"12\" cy=\"13.5\" r=\"3.5\"/><\u002Fsvg>Snap the delivery<\u002Fbutton><\u002Fdiv>`;\n  document.getElementById('stockSnap').onclick=camStockReading;\n}\nfunction camStockReading(){\n  document.getElementById('camStockIn').innerHTML=shHead('New stock arrived','camStock')+`<div class=\"sheet-body\"><div class=\"reading\"><div class=\"spin\"><\u002Fdiv><div class=\"t\">Reading your delivery…<\u002Fdiv><div class=\"s\">Counting cartons and matching products<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  setTimeout(camStockResult,1300);\n}\nfunction camStockResult(){\n  const totAdd=stockItems.reduce((s,i)=>s+i.add,0);\n  document.getElementById('camStockIn').innerHTML=shHead('New stock arrived','camStock')+`<div class=\"sheet-body\"><div style=\"padding:6px 0 4px\"><div class=\"eyebrow q\">We counted<\u002Fdiv><h3 style=\"font-size:27px;margin:8px 0 16px\">${stockItems.length} products<\u002Fh3><\u002Fdiv>${stockItems.map(it=>`<div class=\"stockrow\"><div class=\"th\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">${glyphs[it.g]}<\u002Fsvg><\u002Fdiv><div class=\"m\"><div class=\"nm\">${it.n}<\u002Fdiv><div class=\"was\">${it.was}<\u002Fdiv><\u002Fdiv><div class=\"add\">+${it.add}<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv><div class=\"sheet-foot\"><button class=\"bigbtn green\" id=\"stockConfirm\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>Update stock · +${totAdd}<\u002Fbutton><\u002Fdiv>`;\n  document.getElementById('stockConfirm').onclick=()=>{document.getElementById('camStock').classList.remove('on');showToast('Stock updated · '+totAdd+' added');};\n}\n\nlet recEnded=false;\nfunction openVoice(){camVoiceIdle();document.getElementById('camVoice').classList.add('on');}\nfunction camVoiceIdle(){\n  document.getElementById('camVoiceIn').innerHTML=shHead('Update availability','camVoice')+`<div class=\"sheet-body\"><div class=\"micwrap\"><button class=\"mic\" id=\"mic\">${micIc}<\u002Fbutton><div class=\"mic-lbl\">Hold to talk<\u002Fdiv><div class=\"mic-hint\">Say what changed — “ogbono finished till Friday”<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  document.getElementById('mic').addEventListener('pointerdown',e=>{e.preventDefault();camVoiceRec();});\n}\nfunction camVoiceRec(){\n  recEnded=false;\n  document.getElementById('camVoiceIn').innerHTML=shHead('Update availability','camVoice')+`<div class=\"sheet-body\"><div class=\"micwrap\"><button class=\"mic rec\" id=\"mic\">${micIc}<\u002Fbutton><div class=\"mic-lbl\">Listening…<\u002Fdiv><div class=\"bars\">${'<i><\u002Fi>'.repeat(9)}<\u002Fdiv><div class=\"mic-hint\">Release when you're done<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  document.querySelectorAll('.bars i').forEach((b,i)=>b.style.animationDelay=(i*.07)+'s');\n  const end=()=>{if(recEnded)return;recEnded=true;camVoiceUnderstanding();};\n  const mic=document.getElementById('mic');\n  mic.addEventListener('pointerup',end);mic.addEventListener('pointerleave',end);mic.addEventListener('pointercancel',end);\n  window.addEventListener('pointerup',end,{once:true});\n}\nfunction camVoiceUnderstanding(){\n  document.getElementById('camVoiceIn').innerHTML=shHead('Update availability','camVoice')+`<div class=\"sheet-body\"><div class=\"reading\"><div class=\"spin\"><\u002Fdiv><div class=\"t\">Understanding…<\u002Fdiv><div class=\"s\">Matching to your catalogue<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  setTimeout(camVoiceConfirm,950);\n}\nfunction camVoiceConfirm(){\n  document.getElementById('camVoiceIn').innerHTML=shHead('Update availability','camVoice')+`<div class=\"sheet-body\"><div class=\"heard\"><div class=\"k\">We heard<\u002Fdiv><div class=\"q\">“ogbono finished till Friday”<\u002Fdiv><\u002Fdiv><div class=\"parsed\"><div class=\"pr\"><span class=\"pk\">Product<\u002Fspan><span class=\"pv\">Ogbono<\u002Fspan><\u002Fdiv><div class=\"pr\"><span class=\"pk\">Availability<\u002Fspan><span class=\"pv warn\">Out of stock<\u002Fspan><\u002Fdiv><div class=\"pr\"><span class=\"pk\">Back in stock<\u002Fspan><span class=\"pv\">Friday<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"sheet-foot\"><button class=\"bigbtn green\" id=\"voiceYes\" style=\"margin-bottom:10px\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>That's right<\u002Fbutton><button class=\"bigbtn ghost\" id=\"voiceNo\">Say it again<\u002Fbutton><\u002Fdiv>`;\n  document.getElementById('voiceYes').onclick=()=>{document.getElementById('camVoice').classList.remove('on');showToast('Availability updated · Ogbono');};\n  document.getElementById('voiceNo').onclick=camVoiceIdle;\n}\n\n// ===== nav =====\nconst views={orders:'v-orders',detail:'v-detail',camera:'v-camera',messages:'v-messages',thread:'v-thread',catalogue:'v-catalogue',earnings:'v-earnings'};\nfunction go(v){\n  Object.values(views).forEach(id=>document.getElementById(id).classList.remove('on'));\n  document.getElementById(views[v]).classList.add('on');\n  document.getElementById('actionbar').classList.toggle('on',v==='detail');\n  const pushed=(v==='detail'||v==='thread'||v==='catalogue'||v==='earnings');\n  document.getElementById('tabbar').classList.toggle('hide',pushed);\n  document.getElementById('threadComposer').classList.toggle('on',v==='thread');\n  const tabFor=v==='detail'?'orders':(v==='thread'?'messages':v);\n  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tabFor));\n  setHeader(v);\n  if(v==='orders')renderOrders();\n  if(v==='detail')renderDetail();\n  if(v==='catalogue')renderCatalogue();\n  if(v==='earnings')renderEarnings();\n  scroll.scrollTop=0;\n}\ndocument.getElementById('tabbar').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)go(t.dataset.tab);});\n\nfunction setHeader(v){\n  const h=document.getElementById('header');\n  const backBtn=t=>`<button class=\"back\" data-back=\"${t}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M15 6l-6 6 6 6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Fbutton>`;\n  if(v==='detail')h.innerHTML=backBtn('orders')+`<div class=\"brand\"><h2>${currentId}<\u002Fh2><\u002Fdiv>`;\n  else if(v==='thread')h.innerHTML=backBtn('messages')+`<div class=\"brand\"><h2>${currentThread?currentThread.who:''}<\u002Fh2><\u002Fdiv>`;\n  else if(v==='catalogue')h.innerHTML=backBtn('orders')+`<div class=\"brand\"><h2>Catalogue<\u002Fh2><\u002Fdiv>`;\n  else if(v==='earnings')h.innerHTML=backBtn('orders')+`<div class=\"brand\"><h2>Earnings<\u002Fh2><\u002Fdiv>`;\n  else h.innerHTML=`<div class=\"brand\"><div class=\"wm\" style=\"display:flex;align-items:center;gap:7px\"><svg class=\"leafmark\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F3D2B\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex:none\"><path d=\"M11 21c-5-1-8-5-8-11 6 0 10 4 10 11M13 21c5-1 8-5 8-11-6 0-10 4-10 11\"/><path d=\"M12 22V10\" stroke=\"#C05621\" stroke-width=\"2.2\"/><\u002Fsvg><span>Afri<span class=\"m\">Mart<\u002Fspan> <span class=\"tag\">Seller<\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"store\">Mama Ngozi · Bronx, NY<\u002Fdiv><\u002Fdiv><button class=\"menu\" data-menu><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><circle cx=\"5\" cy=\"12\" r=\"1.7\" fill=\"currentColor\"/><circle cx=\"12\" cy=\"12\" r=\"1.7\" fill=\"currentColor\"/><circle cx=\"19\" cy=\"12\" r=\"1.7\" fill=\"currentColor\"/><\u002Fsvg><\u002Fbutton>`;\n  const bk=h.querySelector('[data-back]');if(bk)bk.addEventListener('click',()=>go(bk.dataset.back));\n}\n\n// ===== messages threads / catalogue / earnings / menu =====\nconst threads=[\n  {who:'Amara O.',order:'#1042',msgs:[{f:'in',t:'Hi — is the egusi finely ground? Making soup tonight.'}]},\n  {who:'Kofi B.',msgs:[{f:'in',t:'Thank you — the palm oil was perfect.'}]},\n  {who:'AfriMart',support:true,msgs:[{f:'support',t:'Your payout of $412.80 is on the way.'},{f:'support',t:'It should reach your account by Friday.'}]},\n  {who:'Ngozi A.',msgs:[{f:'in',t:'Do you restock plantain flour on Fridays?'}]}\n];\nlet currentThread=null;\nfunction renderThread(){\n  const t=currentThread;let html='';\n  if(t.order)html+=`<div class=\"orderchip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M6 3h12l1 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7l1-4z\" stroke-linejoin=\"round\"/><\u002Fsvg>About order ${t.order}<\u002Fdiv>`;\n  html+=t.msgs.map(m=>m.f==='out'?`<div class=\"b-out\">${m.t}<\u002Fdiv>`:`<div class=\"b-in ${m.f==='support'?'support':''}\">${m.t}<\u002Fdiv>`).join('');\n  document.getElementById('threadBody').innerHTML=html;scroll.scrollTop=scroll.scrollHeight;\n}\nfunction openThread(i){currentThread=threads[i];go('thread');renderThread();}\ndocument.getElementById('threadSend').addEventListener('click',sendThread);\ndocument.getElementById('threadInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendThread();});\nfunction sendThread(){const inp=document.getElementById('threadInput');const v=inp.value.trim();if(!v||!currentThread)return;currentThread.msgs.push({f:'out',t:v});inp.value='';renderThread();}\n\nconst catalogue=[{n:'Egusi',g:'leaf',price:8.50,stock:true},{n:'Garri',g:'wheat',price:12.00,stock:true},{n:'Red Palm Oil',g:'jar',price:15.30,stock:true},{n:'Ata Rodo',g:'pepper',price:6.75,stock:true},{n:'Ogbono',g:'seed',price:9.20,stock:false},{n:'Plantain Flour',g:'leaf',price:10.20,stock:true}];\nlet catIdx=null,editPrice=0,editStock=true;\nfunction renderCatalogue(){\n  document.getElementById('catTiles').innerHTML=catalogue.map((p,i)=>`<button class=\"cat-tile\" data-cat=\"${i}\"><div class=\"pic\"><span class=\"st ${p.stock?'in':'out'}\">${p.stock?'In stock':'Out'}<\u002Fspan><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">${glyphs[p.g]}<\u002Fsvg><\u002Fdiv><div class=\"b\"><div class=\"nm\">${p.n}<\u002Fdiv><div class=\"pr tnum\">$${money(p.price)}<\u002Fdiv><div class=\"edit\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 20l4-1L19 8a2 2 0 0 0-3-3L5 16l-1 4z\" stroke-linejoin=\"round\"/><\u002Fsvg>Tap to edit<\u002Fdiv><\u002Fdiv><\u002Fbutton>`).join('');\n}\nfunction openCatEdit(i){catIdx=i;editPrice=catalogue[i].price;editStock=catalogue[i].stock;drawCatEdit();document.getElementById('catSheet').classList.add('on');}\nfunction drawCatEdit(){\n  const p=catalogue[catIdx];\n  document.getElementById('catSheetIn').innerHTML=shHead('Edit product','catSheet')+`<div class=\"sheet-body\"><div class=\"cat-edit\"><div class=\"en\">${p.n}<\u002Fdiv><div class=\"k\">Price<\u002Fdiv><div class=\"bigprice\"><button id=\"pMinus\">−<\u002Fbutton><div class=\"v tnum\">$${money(editPrice)}<\u002Fdiv><button id=\"pPlus\">+<\u002Fbutton><\u002Fdiv><div class=\"k\">Availability<\u002Fdiv><div class=\"seg\"><button class=\"instk ${editStock?'on':''}\" id=\"segIn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>In stock<\u002Fbutton><button class=\"outstk ${!editStock?'on':''}\" id=\"segOut\">Out of stock<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"sheet-foot\"><button class=\"bigbtn green\" id=\"catSave\">Save<\u002Fbutton><\u002Fdiv>`;\n  document.getElementById('pMinus').onclick=()=>{editPrice=Math.max(0.5,+(editPrice-0.5).toFixed(2));drawCatEdit();};\n  document.getElementById('pPlus').onclick=()=>{editPrice=+(editPrice+0.5).toFixed(2);drawCatEdit();};\n  document.getElementById('segIn').onclick=()=>{editStock=true;drawCatEdit();};\n  document.getElementById('segOut').onclick=()=>{editStock=false;drawCatEdit();};\n  document.getElementById('catSave').onclick=()=>{catalogue[catIdx].price=editPrice;catalogue[catIdx].stock=editStock;document.getElementById('catSheet').classList.remove('on');renderCatalogue();showToast(catalogue[catIdx].n+' updated');};\n}\n\nfunction renderEarnings(){\n  const hist=[{d:'Jul 5 – Jul 11',s:'Paid Fri Jul 12',amt:388.40},{d:'Jun 28 – Jul 4',s:'Paid Fri Jul 5',amt:401.10},{d:'Jun 21 – Jun 27',s:'Paid Fri Jun 28',amt:355.75}];\n  document.getElementById('earnHistory').innerHTML=hist.map(h=>`<div class=\"erow\"><div class=\"l\"><div class=\"d\">${h.d}<\u002Fdiv><div class=\"s\">${h.s}<\u002Fdiv><\u002Fdiv><div class=\"r\"><span class=\"amt tnum\">$${money(h.amt)}<\u002Fspan><span class=\"paid\">Paid<\u002Fspan><\u002Fdiv><\u002Fdiv>`).join('');\n}\n\ndocument.addEventListener('click',e=>{\n  const menu=e.target.closest('[data-menu]'),mi=e.target.closest('[data-nav-menu]'),mrow=e.target.closest('.mrow'),cat=e.target.closest('[data-cat]');\n  if(menu){document.getElementById('menuSheet').classList.add('on');return;}\n  if(mi){document.getElementById('menuSheet').classList.remove('on');go(mi.dataset.navMenu);return;}\n  if(mrow){const rows=[...document.querySelectorAll('.mrow')];openThread(rows.indexOf(mrow));return;}\n  if(cat){openCatEdit(+cat.dataset.cat);return;}\n});\n\n// ===== toast =====\nconst toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');let tT;\nfunction showToast(m){toastMsg.textContent=m;toast.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toast.classList.remove('show'),2200);}\n\n// ===== logo downloads =====\nconst LEAF=(mid,stroke)=>`<path d=\"M11 21c-5-1-8-5-8-11 6 0 10 4 10 11M13 21c5-1 8-5 8-11-6 0-10 4-10 11\" fill=\"none\" stroke=\"${stroke}\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><path d=\"M12 22V10\" fill=\"none\" stroke=\"${mid}\" stroke-width=\"2\" stroke-linecap=\"round\"/>`;\nconst markSvg=(mid,stroke,bg)=>`<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"512\" height=\"512\">${bg?`<rect width=\"24\" height=\"24\" fill=\"${bg}\"/>`:''}${LEAF(mid,stroke)}<\u002Fsvg>`;\nconst lockSvg=(mid,stroke,txt,accent,bg)=>`<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 64\" width=\"1040\" height=\"256\">${bg?`<rect width=\"260\" height=\"64\" fill=\"${bg}\"/>`:''}<g transform=\"translate(8,8) scale(2)\">${LEAF(mid,stroke)}<\u002Fg><text x=\"70\" y=\"44\" font-family=\"Cormorant Garamond, Georgia, serif\" font-weight=\"700\" font-size=\"44\" letter-spacing=\"-0.8\" fill=\"${txt}\">Afri<tspan fill=\"${accent}\">Mart<\u002Ftspan><\u002Ftext><\u002Fsvg>`;\nconst LOGOS={\n  'mark':markSvg('#C05621','#1F3D2B',null),\n  'mark-reversed':markSvg('#E8A44D','#FAF5EE','#1F3D2B'),\n  'lockup':lockSvg('#C05621','#1F3D2B','#1F3D2B','#C05621',null),\n  'lockup-reversed':lockSvg('#E8A44D','#FAF5EE','#FFFFFF','#E8A44D','#1F3D2B')\n};\nfunction saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}\ndocument.getElementById('logoDl').addEventListener('click',e=>{\n  const b=e.target.closest('[data-dl]');if(!b)return;const k=b.dataset.dl;\n  if(k==='png'){\n    const img=new Image();\n    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.drawImage(img,0,0,512,512);c.toBlob(bl=>saveBlob(bl,'afrimart-mark-512.png'));};\n    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGOS['mark']);\n    showToast('Downloading PNG');return;\n  }\n  saveBlob(new Blob([LOGOS[k]],{type:'image/svg+xml'}),`afrimart-${k}.svg`);\n  showToast('Downloading SVG');\n});\n\n// init\nsetHeader('orders');renderOrders();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
