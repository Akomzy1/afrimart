<style>
:root{
  --green:#1f3d2b;--green-700:#183021;--green-800:#112318;--green-50:#eef4ef;--green-100:#d5e4d9;
  --terra:#c05621;--terra-600:#a2461a;--terra-50:#fcf1ea;
  --gold:#b0894f;--gold-soft:#cbab72;--gold-line:#d9c39b;
  --ivory:#faf5ee;--cream:#f3ebdf;--panel:#fffdf8;--card:#ffffff;
  --ink:#23201a;--ink-2:#574f42;--ink-3:#7f7361;
  --line:#e7dcc9;--line-soft:#efe6d6;
  --leaf:#3e9c63;--amber:#e8a44d;--berry:#c0392b;--teal:#264653;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
  --r-xs:2px;--r-sm:3px;--r-md:5px;--r-lg:8px;--app:430px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#e7ddcb;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:26px 0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em;color:var(--ink)}
p{margin:0}button{font-family:inherit;cursor:pointer}
.serif{font-family:var(--serif)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--terra)}
.eyebrow.q{color:var(--ink-3)}

.phone{width:var(--app);height:min(908px,94dvh);background:var(--ivory);border-radius:46px;position:relative;overflow:hidden;box-shadow:0 42px 90px -34px rgba(31,61,43,.55),0 0 0 10px #14110c,0 0 0 12px #2b2a26;display:flex;flex-direction:column}
@media(max-width:480px){body{padding:0}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}

.status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:14px;font-weight:600;z-index:40}
.status .r{display:flex;gap:7px;align-items:center}
.status svg{height:13px;width:auto}

/* header */
.header{flex:none;min-height:56px;display:flex;align-items:center;gap:12px;padding:6px 16px 12px;z-index:30}
.back{width:40px;height:40px;flex:none;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.back:active{transform:translateY(1px)}.back svg{width:20px;height:20px}
.header .ttl{flex:1;min-width:0}
.header .ttl .eyebrow{color:var(--ink-3)}
.header .ttl h2{font-size:23px;line-height:1.05;margin-top:2px}
.iconbtn{width:40px;height:40px;flex:none;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.iconbtn:active{transform:translateY(1px)}.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:20px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--ivory)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block}
.pad{padding:0 18px}

/* search bar */
.searchrow{padding:0 16px 6px;display:flex;gap:10px}
.sbar{flex:1;height:50px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0}
.sbar svg{width:19px;height:19px;color:var(--green);flex:none}
.sbar input{border:0;outline:0;background:transparent;font-family:var(--sans);font-size:15px;color:var(--ink);width:100%}
.sbar input::placeholder{color:var(--ink-3)}
.filterbtn{height:50px;padding:0 15px;flex:none;background:var(--green);color:#f4ede1;border:0;border-radius:var(--r-md);display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.filterbtn:active{transform:translateY(1px)}.filterbtn svg{width:16px;height:16px}
.filterbtn .fc{background:var(--gold-soft);color:var(--green-800);font-size:11px;font-weight:700;border-radius:10px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* category chips */
.chips{display:flex;gap:9px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:8px 15px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);letter-spacing:.01em;transition:.14s}
.chip.on{background:var(--green);border-color:var(--green);color:#f4ede1}

.countline{padding:2px 18px 12px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-2)}
.countline b{font-style:normal;font-weight:600;color:var(--ink)}

/* product grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 20px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:.16s cubic-bezier(.2,.6,.2,1);text-align:left}
.pcard:active{transform:translateY(1px)}
.pcard .shot{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 22%,#fbf6ec 0%,#efe6d5 80%)}
.pcard .shot .g{color:var(--gold);opacity:.5}.pcard .shot .g svg{width:38px;height:38px}
.pcard .shot .fav{position:absolute;top:8px;right:8px;width:29px;height:29px;border-radius:50%;background:rgba(255,255,255,.85);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--terra)}
.pcard .shot .fav svg{width:14px;height:14px}.pcard .shot .fav.on svg{fill:var(--terra)}
.pcard .shot .flag{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--gold-line);border-radius:var(--r-xs);padding:3px 7px;background:linear-gradient(180deg,#fffdf8,#fbf5ea)}
.pcard .shot .flag svg{width:10px;height:10px;color:var(--gold)}
.pcard .shot .flag span{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.pcard .body{padding:11px 12px 13px}
.pcard .nm{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.08;color:var(--ink)}
.pcard .alt{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-3);margin-top:1px;line-height:1.25}
.pcard .price{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink);margin:9px 0 6px}
.pcard .price small{font-family:var(--sans);font-size:10px;font-weight:400;color:var(--ink-3)}
.pcard .seller{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);line-height:1.3}
.pcard .seller .seal{width:13px;height:13px;flex:none;color:var(--gold)}
.pcard .ships{font-size:10px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:4px}
.pcard .ships svg{width:11px;height:11px;color:var(--leaf)}

/* resolved-name + zero state */
.resolved{padding:2px 18px 14px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-2);line-height:1.4}
.resolved b{font-style:normal;font-weight:600;color:var(--ink)}
.zero{padding:40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.zero .ic{width:58px;height:58px;border-radius:50%;border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;color:var(--gold);margin-bottom:20px;background:var(--panel)}
.zero .ic svg{width:26px;height:26px}
.zero h3{font-size:26px;margin-bottom:8px}
.zero p{font-size:14px;color:var(--ink-2);max-width:30ch;line-height:1.5}
.zero .closest{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;align-items:center;gap:13px;width:100%;max-width:320px;text-align:left}
.zero .closest .sw{width:44px;height:44px;border-radius:var(--r-md);background:radial-gradient(120% 120% at 50% 22%,#fbf6ec,#efe6d5);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none}
.zero .closest .sw svg{width:22px;height:22px}
.zero .closest .m{flex:1;min-width:0}
.zero .closest .m .l{font-size:11px;color:var(--ink-3)}
.zero .closest .m .n{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1}
.zero .closest .go{color:var(--green);font-size:13px;font-weight:600}
.zero .ai{margin-top:22px;display:inline-flex;align-items:center;gap:8px;color:var(--terra);font-size:14px;font-weight:600}
.zero .ai svg{width:16px;height:16px}

/* ============ PRODUCT DETAIL ============ */
.gallery{position:relative;margin:0 16px;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(130% 110% at 50% 24%,#fbf6ec 0%,#ece2cf 85%);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.gallery .g{color:var(--gold);opacity:.55}.gallery .g svg{width:96px;height:96px}
.gallery .fav{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--terra)}
.gallery .fav svg{width:19px;height:19px}.gallery .fav.on svg{fill:var(--terra)}
.gallery .flag{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-line);border-radius:var(--r-xs);padding:5px 11px;background:linear-gradient(180deg,#fffdf8,#fbf5ea)}
.gallery .flag svg{width:13px;height:13px;color:var(--gold)}
.gallery .flag span{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.thumbs{display:flex;gap:9px;justify-content:center;padding:14px 0 4px}
.thumbs .t{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:radial-gradient(120% 120% at 50% 22%,#fbf6ec,#efe6d5);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.thumbs .t svg{width:20px;height:20px;opacity:.5}
.thumbs .t.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green-50)}

.pdhead{padding:12px 20px 0}
.pdhead h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.02}
.langtags{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 0}
.langtag{border:1px solid var(--line);border-radius:var(--r-xs);padding:5px 10px;background:var(--panel);font-size:11px;color:var(--ink-2)}
.langtag b{font-weight:600;color:var(--ink);font-family:var(--serif);font-size:14px}
.langtag .lg{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:1px}
.priceline{display:flex;align-items:baseline;gap:10px;padding:18px 20px 0}
.priceline .p{font-family:var(--serif);font-weight:600;font-size:30px}
.priceline .u{font-size:12px;color:var(--ink-3)}
.footnote{margin:10px 20px 0;padding-left:14px;border-left:2px solid var(--gold-line);font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-2);line-height:1.4}

.block{margin:22px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px}
.block .bt{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
/* seller block */
.seller-b{display:flex;align-items:center;gap:13px}
.seller-b .av{width:50px;height:50px;border-radius:50%;background:linear-gradient(155deg,#2c5940,#1f3d2b);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:600;flex:none}
.seller-b .m{flex:1;min-width:0}
.seller-b .nm{font-family:var(--serif);font-size:19px;font-weight:600;display:flex;align-items:center;gap:7px;line-height:1.1}
.seller-b .nm .seal{width:16px;height:16px;color:var(--gold);flex:none}
.seller-b .sub{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:8px}
.stars{display:inline-flex;align-items:center;gap:2px}
.stars svg{width:13px;height:13px;color:var(--amber)}
.seller-b .visit{font-size:12.5px;font-weight:600;color:var(--green);flex:none}

/* also available */
.also .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.also .row:first-of-type{border-top:0;padding-top:0}
.also .row .sw{width:40px;height:40px;border-radius:var(--r-md);background:radial-gradient(120% 120% at 50% 22%,#fbf6ec,#efe6d5);display:flex;align-items:center;justify-content:center;color:var(--gold);flex:none}
.also .row .sw svg{width:20px;height:20px;opacity:.5}
.also .row .m{flex:1;min-width:0}
.also .row .m .n{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.also .row .m .n .seal{width:12px;height:12px;color:var(--gold);flex:none}
.also .row .m .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.also .row .pr{text-align:right;flex:none}
.also .row .pr .p{font-family:var(--serif);font-weight:600;font-size:17px}
.also .row .pr .s{font-size:10px;color:var(--ink-3)}

/* shipping estimator */
.est .field{display:flex;gap:9px;margin-bottom:14px}
.est .field .box{flex:1;height:46px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);display:flex;align-items:center;gap:9px;padding:0 13px;transition:.14s}
.est .field .box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(192,86,33,.14)}
.est .field .box svg{width:16px;height:16px;color:var(--ink-3)}
.est .field input{border:0;outline:0;background:transparent;font-family:var(--sans);font-size:14px;width:100%;letter-spacing:.04em}
.est .field .go{height:46px;padding:0 18px;background:var(--green);color:#f4ede1;border:0;border-radius:var(--r-sm);font-size:13.5px;font-weight:600}
.est .field .go:active{transform:translateY(1px)}
.est .result{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.est .result .arr{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600}
.est .result .arr b{color:var(--green)}
.est .ship{margin-top:14px}
.est .ship .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.est .ship .top .a{font-size:12.5px;color:var(--ink-2)}.est .ship .top .a b{color:var(--terra);font-weight:600}
.est .ship .top .b{font-size:11px;color:var(--ink-3)}
.est .ship .track{height:6px;background:var(--cream);border-radius:20px;overflow:hidden;border:1px solid var(--line-soft)}
.est .ship .fill{height:100%;width:66%;background:linear-gradient(90deg,var(--terra),var(--terra-600));border-radius:20px;transition:width .5s cubic-bezier(.2,.6,.2,1)}

/* how it's used */
.used{margin:22px 20px 0}
.used h3{font-size:24px;margin-bottom:8px}
.used p{font-size:14.5px;color:var(--ink-2);line-height:1.62;font-family:var(--serif)}

    also:[{s:'Accra Home Foods',metro:'Newark, NJ',v:true,p:21.50}],
    used:'Firm, separate grains that stand up to the tomato-rich sauce of a proper party jollof.'},
  {id:'plantain',n:'Plantain Flour',alt:'Plantain — unripe flour',alts:['plantain','elubo ogede'],g:'leaf',price:10.20,unit:'/ 1kg',seller:'Mama Ngozi',metro:'Bronx, NY',verified:true,ships:'1–2 days',cat:'Grains & flours',cuisine:'Nigerian',rating:4.4,reviews:54,fresh:false,
    langs:[['Yoruba','Èlùbọ̀ ọ̀gẹ̀dẹ̀'],['Igbo','Ji oko']],
    also:[{s:'West Market Co.',metro:'Dallas, TX',v:false,p:10.80}],
    used:'Stir into hot water for a smooth swallow, or bake into wholesome plantain treats.'}
];
const cuisines=['Nigerian','Ghanaian','Ethiopian','Somali','Kenyan','Cameroonian'];
const categories=['Grains & flours','Oils','Spices & seasonings','Legumes & seeds'];
const money=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// ---- state ----
let activeChip='All';
let filters={cuisine:new Set(),cat:new Set(),verifiedOnly:false};
let current=null,qty=1;

// ---- header render ----
function setHeader(view){
  const h=document.getElementById('header');
  if(view==='product'){
    h.innerHTML=`<button class="back" data-nav="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="ttl"><div class="eyebrow">${current.cuisine} · ${current.cat}</div></div><button class="iconbtn" data-toast="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h2l1.6 10.2a1.5 1.5 0 0 0 1.5 1.3h8a1.5 1.5 0 0 0 1.5-1.2L20.5 8H7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.2" fill="currentColor"/><circle cx="18" cy="20" r="1.2" fill="currentColor"/></svg><span class="dot">3</span></button>`;
  }else if(view==='search'){
    h.innerHTML=`<button class="back" data-nav="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="ttl"><div class="eyebrow">Search</div><h2>The market</h2></div>`;
  }else{
    h.innerHTML=`<div class="ttl" style="padding-left:4px"><div class="eyebrow">Shop</div><h2>Everyday staples</h2></div><button class="iconbtn" data-toast="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h2l1.6 10.2a1.5 1.5 0 0 0 1.5 1.3h8a1.5 1.5 0 0 0 1.5-1.2L20.5 8H7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.2" fill="currentColor"/><circle cx="18" cy="20" r="1.2" fill="currentColor"/></svg><span class="dot">3</span></button>`;
  }
}

// ---- card markup ----
function cardHTML(p){
  return `<button class="pcard" data-open="${p.id}">
    <div class="shot">
      ${p.fresh?`<span class="flag">${freshIc}<span>Fresh</span></span>`:''}
      <span class="fav" data-fav="${p.id}">${heartIc}</span>
      <span class="g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${glyphs[p.g]}</svg></span>
    </div>
    <div class="body">
      <div class="nm">${p.n}</div>
      <div class="alt">${p.alt}</div>
      <div class="price tnum">$${money(p.price)} <small>${p.unit}</small></div>
      <div class="seller">${p.seller}${p.verified?sealSvg:''}</div>
      <div class="ships">${shipIc.replace('stroke-width="1.7"','stroke-width="2"')} Ships in ${p.ships}</div>
    </div>
  </button>`;
}

// ---- shop render ----
function renderChips(){
  const c=document.getElementById('catchips');
  const all=['All',...categories];
  c.innerHTML=all.map(x=>`<button class="chip ${x===activeChip?'on':''}" data-chip="${x}">${x}</button>`).join('');
}
function filtered(){
  return products.filter(p=>{
    if(activeChip!=='All'&&p.cat!==activeChip)return false;
    if(filters.cat.size&&!filters.cat.has(p.cat))return false;
    if(filters.cuisine.size&&!filters.cuisine.has(p.cuisine))return false;
    if(filters.verifiedOnly&&!p.verified)return false;
    return true;
  });
}
function renderShop(){
  renderChips();
  const list=filtered();
  document.getElementById('shopCount').textContent=list.length;
  document.getElementById('shopGrid').innerHTML=list.map(cardHTML).join('')||`<div style="grid-column:1/-1;text-align:center;color:var(--ink-3);padding:30px 0;font-family:var(--serif);font-style:italic;font-size:17px">No staples match those filters.</div>`;
}

// ---- filters slide-over ----
function renderFilters(){
  const b=document.getElementById('soBody');
  const cnt=cat=>products.filter(p=>p.cat===cat).length;
  const cntCu=cu=>products.filter(p=>p.cuisine===cu).length;
  b.innerHTML=`
    <div class="fgroup"><div class="gt">Cuisine</div>${cuisines.map(c=>`<label class="check ${filters.cuisine.has(c)?'on':''}" data-cuisine="${c}"><span class="bx">${shipIc.replace('stroke-width="1.7"','stroke-width="2.4"')}</span><span class="lb">${c}</span><span class="ct">${cntCu(c)}</span></label>`).join('')}</div>
    <div class="fgroup"><div class="gt">Category</div>${categories.map(c=>`<label class="check ${filters.cat.has(c)?'on':''}" data-cat="${c}"><span class="bx">${shipIc.replace('stroke-width="1.7"','stroke-width="2.4"')}</span><span class="lb">${c}</span><span class="ct">${cnt(c)}</span></label>`).join('')}</div>
    <div class="fgroup" style="border-bottom:0"><div class="gt">Seller</div><label class="check ${filters.verifiedOnly?'on':''}" data-verified><span class="bx">${shipIc.replace('stroke-width="1.7"','stroke-width="2.4"')}</span><span class="lb">Verified sellers only</span></label></div>`;
}
function filterCount(){return filters.cuisine.size+filters.cat.size+(filters.verifiedOnly?1:0);}
function syncFilterBadge(){const f=document.getElementById('fcount');const n=filterCount();f.style.display=n?'flex':'none';f.textContent=n;}
function openFilters(){renderFilters();document.getElementById('scrim').classList.add('on');document.getElementById('slideover').classList.add('on');}
function closeFilters(){document.getElementById('scrim').classList.remove('on');document.getElementById('slideover').classList.remove('on');}

document.getElementById('soBody').addEventListener('click',e=>{
  const cu=e.target.closest('[data-cuisine]'),ca=e.target.closest('[data-cat]'),v=e.target.closest('[data-verified]');
  if(cu){const k=cu.dataset.cuisine;filters.cuisine.has(k)?filters.cuisine.delete(k):filters.cuisine.add(k);cu.classList.toggle('on');}
  if(ca){const k=ca.dataset.cat;filters.cat.has(k)?filters.cat.delete(k):filters.cat.add(k);ca.classList.toggle('on');}
  if(v){filters.verifiedOnly=!filters.verifiedOnly;v.classList.toggle('on');}
});
document.getElementById('openFilters').addEventListener('click',openFilters);
document.getElementById('closeFilters').addEventListener('click',closeFilters);
document.getElementById('scrim').addEventListener('click',closeFilters);
document.getElementById('applyFilters').addEventListener('click',()=>{closeFilters();syncFilterBadge();renderShop();});
document.getElementById('clearFilters').addEventListener('click',()=>{filters={cuisine:new Set(),cat:new Set(),verifiedOnly:false};renderFilters();});

document.getElementById('catchips').addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(c){activeChip=c.dataset.chip;renderShop();}});

// ---- search ----
function resolve(q){
  q=q.trim().toLowerCase();if(!q)return null;
  for(const p of products){
    if(p.n.toLowerCase().includes(q)||p.alts.some(a=>a.trim().toLowerCase().includes(q)))return p;
  }
  return null;
}
function renderSearch(q){
  const body=document.getElementById('searchBody');
  const term=q.trim();
  if(!term){body.innerHTML=`<div class="countline" style="font-size:15px">Search by name in any language — <b>garri</b>, <b>gari</b>, <b>berbere</b>.</div>`;return;}
  const hit=resolve(term);
  if(hit){
    const others=hit.alts.slice(0,3).join(', ');
    body.innerHTML=`<div class="resolved">Showing <b>${hit.n.toLowerCase()}</b>, also known as ${others}</div><div class="grid">${products.filter(p=>p===hit||p.cuisine===hit.cuisine).slice(0,6).map(cardHTML).join('')}</div>`;
  }else{
    const closest=products[0];
    body.innerHTML=`<div class="zero">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M9 11h4" stroke-linecap="round"/></svg></div>
      <h3>We couldn't find "${term}"</h3>
      <p>The name may be spelled differently. Here's the closest match in the market.</p>
      <button class="closest" data-open="${closest.id}"><span class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${glyphs[closest.g]}</svg></span><span class="m"><span class="l">Closest match</span><span class="n">${closest.n}</span></span><span class="go">View</span></button>
      <button class="ai" data-cook><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.6 3.4L17 8l-3.4 1.6L12 13l-1.6-3.4L7 8l3.4-1.6z" fill="currentColor" stroke="none"/><path d="M6 15l.9 1.9L9 18l-2.1.9L6 21l-.9-2.1L3 18l2.1-1.1z" fill="currentColor" stroke="none"/></svg>Ask our AI to find it</button>
    </div>`;
  }
}
document.getElementById('searchInput').addEventListener('input',e=>renderSearch(e.target.value));

// ---- product detail ----
function openProduct(id){
  current=products.find(p=>p.id===id);qty=1;
  document.getElementById('pdGallery').innerHTML=`
    ${current.fresh?`<span class="flag">${freshIc}<span>Freshness promise</span></span>`:''}
    <span class="fav" id="pdFav">${heartIc}</span>
    <span class="g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1">${glyphs[current.g]}</svg></span>`;
  document.getElementById('pdThumbs').innerHTML=[0,1,2].map(i=>`<div class="t ${i===0?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${glyphs[current.g]}</svg></div>`).join('');
  document.getElementById('pdName').textContent=current.n;
  document.getElementById('pdLangs').innerHTML=current.langs.map(([lg,nm])=>`<span class="langtag"><span class="lg">${lg}</span><b>${nm}</b></span>`).join('');
  document.getElementById('pdPrice').textContent='$'+money(current.price);
  document.getElementById('pdUnit').textContent=current.unit;
  const fn=document.getElementById('pdFootnote');
  if(current.madeToOrder){fn.style.display='block';fn.textContent='Made to order — please allow 3 to 4 days for this seller to prepare your batch before it ships.';}else fn.style.display='none';
  document.getElementById('pdSeller').innerHTML=`<div class="av">${current.seller[0]}</div><div class="m"><div class="nm">${current.seller}${current.verified?sealSvg:''}</div><div class="sub">${starsFor(current.rating)} ${current.rating.toFixed(1)} · ${current.metro}</div></div><span class="visit">Visit store</span>`;
  document.getElementById('pdAlso').innerHTML=current.also.map(a=>`<div class="row"><span class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${glyphs[current.g]}</svg></span><div class="m"><div class="n">${a.s}${a.v?sealSvg:''}</div><div class="s">${a.metro} · ships in 1–2 days</div></div><div class="pr"><div class="p tnum">$${money(a.p)}</div><div class="s">${current.unit.replace('/ ','')}</div></div></div>`).join('');
  document.getElementById('pdUsedP').textContent=current.used;
  document.getElementById('pdRating').innerHTML=`${current.rating.toFixed(1)} <span class="o">${starsFor(current.rating)}</span>`;
  document.getElementById('pdRevCount').textContent=current.reviews+' reviews';
  const rv=[{who:'Amara O.',r:5,t:'Exactly like the market back home. Sealed well and arrived quickly.'},{who:'Kofi B.',r:5,t:'Fresh and fragrant. The whole order came in one delivery even from two sellers.'}];
  document.getElementById('pdReviews').innerHTML=rv.map(r=>`<div class="item"><div class="top"><div class="av">${r.who[0]}</div><div class="who">${r.who}</div>${starsFor(r.r)}</div><p>${r.t}</p></div>`).join('');
  document.getElementById('addPrice').textContent='$'+money(current.price);
  document.getElementById('qty').textContent=qty;
  computeArrival();
  go('product');
}

// ---- shipping estimator ----
function computeArrival(){
  const d=new Date();d.setDate(d.getDate()+(current&&current.madeToOrder?5:2));
  const fmt=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  document.getElementById('arrDate').textContent=fmt;
  document.getElementById('arrSub').textContent=`Ships in ${current?current.ships:'1–2 days'} from ${current?current.metro:'the seller'}`;
}
document.getElementById('zipGo').addEventListener('click',computeArrival);

// ---- qty + add ----
document.getElementById('addbar').addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');
  if(q){qty=Math.max(1,qty+ +q.dataset.q);document.getElementById('qty').textContent=qty;document.getElementById('addPrice').textContent='$'+money(current.price*qty);}
  if(e.target.closest('#addToCart')){showToast(`${qty} × ${current.n} added to cart`);}
});

// ---- global click: open cards, favs, cook, toast ----
document.body.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]');
  const fav=e.target.closest('[data-fav]');
  const nav=e.target.closest('[data-nav]');
  const cook=e.target.closest('[data-cook]');
  const dt=e.target.closest('[data-toast]');
  const pdFav=e.target.closest('#pdFav');
  if(fav){e.stopPropagation();fav.classList.toggle('on');fav.querySelector('path').setAttribute('fill',fav.classList.contains('on')?'currentColor':'none');return;}
  if(open){openProduct(open.dataset.open);return;}
  if(nav){go(nav.dataset.nav);return;}
  if(cook){showToast('Opening the Cook agent…');return;}
  if(dt){showToast('3 items in your cart');return;}
  if(pdFav){pdFav.classList.toggle('on');pdFav.querySelector('path').setAttribute('fill',pdFav.classList.contains('on')?'currentColor':'none');}
});

// ---- view switch ----
const views={shop:'v-shop',search:'v-search',product:'v-product'};
const scroll=document.getElementById('scroll');
function go(v){
  Object.values(views).forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById(views[v]).classList.add('on');
  document.getElementById('addbar').classList.toggle('on',v==='product');
  document.getElementById('tabbar').classList.toggle('hide',v==='product'||v==='search');
  document.querySelectorAll('.tab[data-nav]').forEach(t=>t.classList.toggle('on',t.dataset.nav===v));
  setHeader(v);
  if(v==='search'){renderSearch('');setTimeout(()=>document.getElementById('searchInput').focus(),60);}
  scroll.scrollTop=0;
}

// ---- toast ----
const toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');let toastT;
function showToast(m){toastMsg.textContent=m;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),2100);}

// ---- init ----
renderShop();setHeader('shop');syncFilterBadge();
</script>


</body></html>
