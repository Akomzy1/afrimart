<style>
:root{
  --green:#1f3d2b;--green-700:#183021;--green-800:#112318;--green-50:#eef4ef;--green-100:#d5e4d9;
  --terra:#c05621;--terra-600:#a2461a;--terra-50:#fcf1ea;
  --gold:#b0894f;--gold-soft:#cbab72;--gold-line:#d9c39b;
  --ivory:#faf5ee;--cream:#f3ebdf;--panel:#fffdf8;--card:#ffffff;
  --ink:#23201a;--ink-2:#574f42;--ink-3:#7f7361;
  --line:#e7dcc9;--line-soft:#efe6d6;
  --leaf:#3e9c63;--amber:#e8a44d;--berry:#c0392b;--teal:#264653;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
  --r-xs:2px;--r-sm:3px;--r-md:5px;--r-lg:8px;--app:430px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#e7ddcb;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:26px 0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em;color:var(--ink)}
p{margin:0}button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--terra)}

.phone{width:var(--app);height:min(908px,94dvh);background:var(--ivory);border-radius:46px;position:relative;overflow:hidden;box-shadow:0 42px 90px -34px rgba(31,61,43,.55),0 0 0 10px #14110c,0 0 0 12px #2b2a26;display:flex;flex-direction:column}
@media(max-width:480px){body{padding:0}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}

.status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:14px;font-weight:600;z-index:40}
.status .r{display:flex;gap:7px;align-items:center}.status svg{height:13px;width:auto}

.header{flex:none;display:flex;align-items:center;gap:12px;padding:2px 16px 12px;border-bottom:1px solid var(--line-soft);z-index:30}
.back,.hicon{width:40px;height:40px;flex:none;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.back:active,.hicon:active{transform:translateY(1px)}.back svg,.hicon svg{width:20px;height:20px}
.header .id{flex:1;display:flex;align-items:center;gap:11px;min-width:0}
.header .id .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(155deg,#2c5940,#1f3d2b);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);flex:none}
.header .id .av svg{width:20px;height:20px}
.header .id .m .eyebrow{color:var(--ink-3)}
.header .id .m h2{font-size:19px;line-height:1.05;margin-top:1px}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.conv{padding:20px 18px 8px;display:flex;flex-direction:column;gap:20px}

/* opening state */
.opening{padding:26px 6px 8px;text-align:left}
.opening .mark{width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);margin-bottom:20px}
.opening .mark svg{width:26px;height:26px}
.opening h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.06;letter-spacing:-.01em;max-width:15ch}
.opening p{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-2);margin-top:12px;max-width:32ch;line-height:1.4}
.exlabel{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px}
.exchips{display:flex;flex-direction:column;gap:10px}
.exchip{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;transition:.14s}
.exchip:hover{border-color:var(--green-100)}.exchip:active{transform:translateY(1px)}
.exchip .t{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink)}
.exchip .s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.exchip .go{width:30px;height:30px;border-radius:50%;background:var(--green-50);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.exchip .go svg{width:15px;height:15px}

/* messages */
.msg-user{align-self:flex-end;max-width:80%;background:var(--green);color:#f2ecdd;border-radius:12px 12px 3px 12px;padding:11px 15px;font-size:14.5px;line-height:1.4}
.msg-agent{display:flex;gap:11px;max-width:100%}
.msg-agent .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(155deg,#2c5940,#1f3d2b);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);flex:none;margin-top:2px}
.msg-agent .av svg{width:18px;height:18px}
.msg-agent .content{flex:1;min-width:0}
.msg-agent .say{font-family:var(--serif);font-size:18px;line-height:1.42;color:var(--ink);margin-bottom:14px}
.msg-agent .say .em{font-style:italic;color:var(--ink-2)}

/* basket card */
.basket{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 10px 26px -18px rgba(31,61,43,.3)}
.basket .bh{padding:15px 16px 13px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.basket .bh .t{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.1}
.basket .bh .c{font-size:11px;color:var(--ink-3);white-space:nowrap;flex:none}
.brow{display:flex;gap:12px;padding:13px 16px;align-items:flex-start}
.brow+.brow{border-top:1px solid var(--line-soft)}
.brow .th{width:44px;height:44px;flex:none;border-radius:var(--r-sm);background:radial-gradient(120% 120% at 50% 22%,#fbf6ec,#efe6d5);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.brow .th svg{width:22px;height:22px;opacity:.55}
.brow .m{flex:1;min-width:0}
.brow .nm{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.1;color:var(--ink)}
.brow .alt{font-size:11px;color:var(--ink-3);margin-top:1px}
.brow .sub{margin-top:7px;font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-2);line-height:1.34;padding-left:11px;border-left:2px solid var(--gold-line)}
.brow .ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-sm);height:30px;background:var(--card)}
.stepper button{width:28px;height:100%;border:0;background:transparent;color:var(--green);font-size:16px;display:flex;align-items:center;justify-content:center}
.stepper button:active{transform:translateY(1px)}
.stepper span{min-width:22px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.brow .price{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.brow .rm{background:0;border:0;color:var(--ink-3);font-size:16px;line-height:1;padding:4px;flex:none;margin:-4px -4px 0 0}
.brow .rm:active{color:var(--terra)}

.arrival{display:flex;gap:9px;align-items:flex-start;padding:13px 16px;background:var(--green-50);border-top:1px solid var(--line-soft)}
.arrival svg{width:16px;height:16px;color:var(--green);flex:none;margin-top:1px}
.arrival p{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.arrival p b{color:var(--ink);font-weight:600}

.btotal{padding:14px 16px}
.btotal .r{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2)}
.btotal .r .v{font-variant-numeric:tabular-nums;color:var(--ink)}
.btotal .free{margin-top:8px;font-size:12px;display:flex;align-items:center;gap:7px;color:var(--terra)}
.btotal .free.done{color:var(--leaf)}
.btotal .free svg{width:14px;height:14px;flex:none}
.btotal .track{height:5px;background:var(--cream);border-radius:20px;overflow:hidden;border:1px solid var(--line-soft);margin-top:8px}
.btotal .fill{height:100%;background:linear-gradient(90deg,var(--terra),var(--terra-600));border-radius:20px;transition:width .5s cubic-bezier(.2,.6,.2,1)}
.btotal .fill.done{background:linear-gradient(90deg,var(--leaf),#2f7d4e)}
.btotal .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.btotal .tot .l{font-family:var(--serif);font-size:18px;font-weight:600}
.btotal .tot .v{font-family:var(--serif);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}

.bact{padding:0 16px 16px}
.addall{width:100%;height:50px;background:var(--terra);color:#fff;border:0;border-radius:var(--r-sm);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px}
.addall:hover{background:var(--terra-600)}.addall:active{transform:translateY(1px)}
.addall svg{width:18px;height:18px}
.reassure{margin-top:13px;text-align:center;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3)}
.reassure a{color:var(--green);font-style:normal;font-weight:600;font-family:var(--sans);font-size:12.5px;text-decoration:none}
.reassure a:hover{color:var(--terra)}

/* typing */
.typing{display:flex;gap:11px}
.typing .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(155deg,#2c5940,#1f3d2b);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);flex:none}
.typing .av svg{width:18px;height:18px}
.typing .dots{background:var(--card);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:13px 16px;display:flex;gap:5px;align-items:center}
.typing .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:bounce 1.2s infinite}
.typing .dots i:nth-child(2){animation-delay:.18s}.typing .dots i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* composer */
.composer{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:30}
.composer .box{display:flex;align-items:flex-end;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:6px 6px 6px 16px;transition:.14s}
.composer .box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(192,86,33,.12)}
.composer textarea{flex:1;border:0;outline:0;background:transparent;resize:none;font-family:var(--sans);font-size:15px;color:var(--ink);line-height:1.4;max-height:88px;padding:8px 0}
.composer textarea::placeholder{color:var(--ink-3)}
.composer .send{width:40px;height:40px;flex:none;border-radius:50%;background:var(--green);color:#f4ede1;border:0;display:flex;align-items:center;justify-content:center;transition:.14s}
.composer .send:hover{background:var(--green-700)}.composer .send:active{transform:translateY(1px)}
.composer .send svg{width:19px;height:19px}
.composer .hint{text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:9px;letter-spacing:.02em}

.toast{position:absolute;left:18px;right:18px;bottom:96px;background:var(--green);color:#f4ede1;border-radius:5px;padding:13px 17px;display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:500;box-shadow:0 16px 34px -16px rgba(17,35,24,.7);z-index:70;opacity:0;visibility:hidden;transform:translateY(140%);transition:transform .34s cubic-bezier(.2,.6,.2,1),opacity .24s,visibility .34s}
.toast.show{transform:translateY(0);opacity:1;visibility:visible}
.toast svg{width:18px;height:18px;color:var(--gold-soft);flex:none}
</style>
</head>

  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Tell me the dish and how many…"></textarea>
      <button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h13M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
    <div class="hint">The recipe agent is a faster option — the full shop is always one tap away</div>
  </div>

  <div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span id="toastMsg"></span></div>
</div>

<script>
const glyphs={
  leaf:'<path d="M11 21c-5-1-8-5-8-11 6 0 10 4 10 11M13 21c5-1 8-5 8-11-6 0-10 4-10 11M12 22V10" stroke-linecap="round" stroke-linejoin="round"/>',
  wheat:'<path d="M12 22V9M12 9c0-2 1.5-3.5 3.5-3.5 0 2-1.5 3.5-3.5 3.5zM12 9c0-2-1.5-3.5-3.5-3.5 0 2 1.5 3.5 3.5 3.5zM12 14c0-2 1.5-3.5 3.5-3.5 0 2-1.5 3.5-3.5 3.5zM12 14c0-2-1.5-3.5-3.5-3.5 0 2 1.5 3.5 3.5 3.5z" stroke-linecap="round" stroke-linejoin="round"/>',
  jar:'<path d="M8 3h8M7 7h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V7zM7 7c0-2 1.5-3 2.5-3M17 7c0-2-1.5-3-2.5-3" stroke-linecap="round" stroke-linejoin="round"/>',
  pepper:'<path d="M8 8c0-3 3-4 5-3M8 8c-2 3-1 8 3 10 5 2 8-3 6-7-1.5-3-6-4-9-3z" stroke-linecap="round" stroke-linejoin="round"/>',
  onion:'<path d="M12 3c1.5 2 2 3 2 4M12 21c-4 0-7-3-7-7 0-3.5 3-8 7-8s7 4.5 7 8c0 4-3 7-7 7zM9 8c-1 2-1 5 0 8M15 8c1 2 1 5 0 8" stroke-linecap="round" stroke-linejoin="round"/>',
  fish:'<path d="M3 12c3-4 8-5 12-5 3 0 5 2 6 5-1 3-3 5-6 5-4 0-9-1-12-5zM17 10.5h.01" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12l-1-3M3 12l-1 3" stroke-linecap="round"/>',
  seed:'<path d="M12 3c4 2 6 5 6 9a6 6 0 0 1-12 0c0-4 2-7 6-9zM12 8v8M9 11h6" stroke-linecap="round" stroke-linejoin="round"/>',
  butter:'<path d="M4 9h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9zM4 9l3-4h10l3 4" stroke-linejoin="round"/>'
};
const money=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const FREE=100;
const dayName=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toLocaleDateString('en-US',{weekday:'long'});};

const recipes={
  jollof:{q:'Jollof rice for 8',
    say:`A proper party jollof for eight — here's everything you'll need. I've kept the rice firm and the pepper base generous, the way it should be.`,
    title:'Jollof rice · serves 8',
    arrive:`Everything travels from one seller in <b>Chicago</b>, so it arrives together by <b>${dayName(2)}</b>.`,
    items:[
      {n:'Parboiled rice',alt:'Long-grain · 5kg',g:'wheat',qty:1,price:22.00,sub:{note:'Kwame & Sons is out of long-grain today — I swapped in Accra Home\'s parboiled. It holds its shape just as well.'}},
      {n:'Plum tomatoes',alt:'Tinned · 6-pack',g:'jar',qty:1,price:9.50},
      {n:'Tomato paste',alt:'Double concentrate · 400g',g:'jar',qty:1,price:4.80},
      {n:'Ata Rodo',alt:'Scotch bonnet · 250g',g:'pepper',qty:2,price:6.75},
      {n:'Red onions',alt:'Net · 2kg',g:'onion',qty:1,price:5.40},
      {n:'Jollof spice blend',alt:'Curry, thyme, bay · 150g',g:'seed',qty:1,price:7.20}
    ]},
  egusi:{q:'Egusi soup for 6',
    say:`Egusi soup for six, the way it's meant to be — nutty, rich and deeply green. Here's your basket, measured for a full pot with some to spare.`,
    title:'Egusi soup · serves 6',
    arrive:`These come from two sellers, so your order arrives in <b>two parcels</b> — ${dayName(2)} and ${dayName(3)}. One order, one total.`,
    items:[
      {n:'Egusi',alt:'Ground melon seeds · 500g',g:'leaf',qty:2,price:8.50},
      {n:'Red Palm Oil',alt:'Cold-pressed · 1L',g:'jar',qty:1,price:15.30},
      {n:'Smoked catfish',alt:'Dried · 300g',g:'fish',qty:1,price:13.90,sub:{note:'I chose smoked catfish over stockfish here — it softens faster and suits a weeknight pot.'}},
      {n:'Spinach',alt:'For ugu leaves · 400g',g:'leaf',qty:2,price:4.20,sub:{note:'Fresh ugu is out of season, so I\'ve used spinach — the closest match in colour and bite.'}},
      {n:'Ground crayfish',alt:'200g',g:'seed',qty:1,price:9.60},
      {n:'Ata Rodo',alt:'Scotch bonnet · 250g',g:'pepper',qty:1,price:6.75}
    ]},
  doro:{q:'Doro wat for 4',
    say:`Doro wat for four. The berbere is the heart of it, so I've chosen a seller who blends theirs fresh to order — worth the short wait.`,
    title:'Doro wat · serves 4',
    arrive:`The berbere is <b>made to order</b>, which adds a couple of days — your parcel arrives <b>${dayName(5)}</b>. Everything ships together.`,
    items:[
      {n:'Berbere',alt:'Spice blend · 200g',g:'seed',qty:1,price:9.40,sub:{note:'Blended fresh by Habesha Spice — this is what gives doro wat its warmth and depth.'}},
      {n:'Niter kibbeh',alt:'Spiced clarified butter · 250g',g:'butter',qty:1,price:11.20},
      {n:'Red onions',alt:'Net · 2kg',g:'onion',qty:1,price:5.40},
      {n:'Chicken',alt:'Free-range, jointed · 1.5kg',g:'fish',qty:1,price:16.80},
      {n:'Garlic & ginger',alt:'Fresh · 300g',g:'seed',qty:1,price:4.30}
    ]}
};

let bid=0;const baskets={};
const conv=document.getElementById('conv'),scroll=document.getElementById('scroll');
const scrollDown=()=>{scroll.scrollTop=scroll.scrollHeight;};

function basketTotal(b){return b.items.reduce((s,i)=>s+i.price*i.qty,0);}
function basketCount(b){return b.items.reduce((s,i)=>s+i.qty,0);}

function basketInner(id){
  const b=baskets[id],tot=basketTotal(b),rem=Math.max(0,FREE-tot),pct=Math.min(100,tot/FREE*100),free=rem<=0;
  return `<div class="bh"><div class="t">${b.title}</div><div class="c">${basketCount(b)} items</div></div>
    ${b.items.map((it,i)=>`<div class="brow">
      <div class="th"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${glyphs[it.g]||glyphs.leaf}</svg></div>
      <div class="m">
        <div style="display:flex;justify-content:space-between;gap:8px"><div><div class="nm">${it.n}</div><div class="alt">${it.alt}</div></div><button class="rm" data-rm="${id},${i}" aria-label="Remove">×</button></div>
        ${it.sub?`<div class="sub">${it.sub.note}</div>`:''}
        <div class="ctrl"><div class="stepper"><button data-step="${id},${i},-1">−</button><span>${it.qty}</span><button data-step="${id},${i},1">+</button></div><div class="price tnum">$${money(it.price*it.qty)}</div></div>
      </div>
    </div>`).join('')}
    <div class="arrival"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8h12v8H2zM14 11h4l3 3v2h-7z" stroke-linejoin="round"/><circle cx="6" cy="18" r="1.4"/><circle cx="18" cy="18" r="1.4"/></svg><p>${b.arrive}</p></div>
    <div class="btotal">
      <div class="r"><span>Running total</span><span class="v tnum">$${money(tot)}</span></div>
      <div class="free ${free?'done':''}">${free?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Free shipping included':`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 8h12v8H2zM14 11h4l3 3v2h-7z" stroke-linejoin="round"/><circle cx="6" cy="18" r="1.2"/><circle cx="18" cy="18" r="1.2"/></svg>$${money(rem)} away from free shipping`}</div>
      <div class="track"><div class="fill ${free?'done':''}" style="width:${pct}%"></div></div>
      <div class="tot"><span class="l">Total</span><span class="v tnum">$${money(tot)}</span></div>
    </div>
    <div class="bact">
      <button class="addall" data-addall="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>Add all to cart · ${basketCount(b)} items</button>
      <div class="reassure">Prefer to choose yourself? <a href="AfriMart Buyer - Browse and Product.html">Browse the full shop</a></div>
    </div>`;
}

function addUser(text){
  const el=document.createElement('div');el.className='msg-user';el.textContent=text;conv.appendChild(el);scrollDown();
}
function addTyping(){
  const el=document.createElement('div');el.className='typing';el.id='typing';
  el.innerHTML=`<div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${glyphs.leaf}</svg></div><div class="dots"><i></i><i></i><i></i></div>`;
  conv.appendChild(el);scrollDown();
}
function addAgent(rec){
  const id=++bid;baskets[id]=JSON.parse(JSON.stringify(rec));
  const el=document.createElement('div');el.className='msg-agent';
  el.innerHTML=`<div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${glyphs.leaf}</svg></div><div class="content"><div class="say">${rec.say}</div><div class="basket" id="basket-${id}">${basketInner(id)}</div></div>`;
  conv.appendChild(el);scrollDown();
}
function addAgentText(html){
  const el=document.createElement('div');el.className='msg-agent';
  el.innerHTML=`<div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${glyphs.leaf}</svg></div><div class="content"><div class="say">${html}</div></div>`;
  conv.appendChild(el);scrollDown();
}

function matchDish(text){
  const t=text.toLowerCase();
  if(t.includes('jollof'))return recipes.jollof;
  if(t.includes('egusi'))return recipes.egusi;
  if(t.includes('doro')||t.includes('wat')||t.includes('berbere'))return recipes.doro;
  return null;
}

function respond(text){
  const op=document.getElementById('opening');if(op)op.remove();
  addUser(text);
  addTyping();
  setTimeout(()=>{
    const ty=document.getElementById('typing');if(ty)ty.remove();
    const rec=matchDish(text);
    if(rec)addAgent(rec);
    else addAgentText(`I'd love to help with that. Tell me the dish and how many you're cooking for — like <span class="em">"egusi soup for 6"</span> — and I'll put the basket together for you.`);
    scrollDown();
  },1050);
}

// events
document.querySelectorAll('[data-dish]').forEach(b=>b.addEventListener('click',()=>respond(recipes[b.dataset.dish].q)));
const input=document.getElementById('input');
function send(){const v=input.value.trim();if(!v)return;input.value='';input.style.height='auto';respond(v);}
document.getElementById('send').addEventListener('click',send);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(88,input.scrollHeight)+'px';});

conv.addEventListener('click',e=>{
  const s=e.target.closest('[data-step]'),r=e.target.closest('[data-rm]'),a=e.target.closest('[data-addall]');
  if(s){const[id,i,d]=s.dataset.step.split(',').map(Number);const b=baskets[id];b.items[i].qty=Math.max(1,b.items[i].qty+d);document.getElementById('basket-'+id).innerHTML=basketInner(id);}
  if(r){const[id,i]=r.dataset.rm.split(',').map(Number);const b=baskets[id];if(b.items.length>1){b.items.splice(i,1);document.getElementById('basket-'+id).innerHTML=basketInner(id);}}
  if(a){const b=baskets[+a.dataset.addall];showToast(`${basketCount(b)} items added to your cart`);}
});

document.getElementById('reset').addEventListener('click',()=>location.reload());

// toast
const toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');let tT;
function showToast(m){toastMsg.textContent=m;toast.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toast.classList.remove('show'),2400);}
</script>


</body></html>
